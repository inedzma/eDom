<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>E-Dom — Prijava</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="kartica">
    <h1>Prijava u E-Dom</h1>

    <p class="greska" th:if="${param.error}">
        Neispravna e-mail adresa ili lozinka.
    </p>
    <p class="uspjeh" th:if="${param.registrovan}">
        Registracija uspješna. Možete se prijaviti.
    </p>
    <p class="uspjeh" th:if="${param.odjava}">
        Uspješno ste odjavljeni.
    </p>

    <form th:action="@{/login}" method="post">
        <label for="username">E-mail</label>
        <input type="email" id="username" name="username" required autofocus>

        <label for="password">Lozinka</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Prijavi se</button>
    </form>

    <p>Nemate nalog? <a th:href="@{/registracija}">Registrujte se</a></p>
</div>
</body>
</html>
