<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="koraci(trenutni)" class="koraci">
    <span th:each="i : ${#numbers.sequence(1,5)}"
          th:classappend="${i == trenutni} ? 'aktivan' : (${i < trenutni} ? 'gotov' : '')">
        <span th:text="${i}">1</span>
        <span th:text="${ {'Studij','Domaćinstvo','Kriteriji', 'Dokumenti', 'Pregled'}[i-1] }">Studij</span>
    </span>
</div>

</body>
</html>
