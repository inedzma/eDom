<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Traka koraka prijave (1 Studij … 5 Pregled). Stil: css/koraci.css -->
<nav th:fragment="koraci(trenutni)" class="kp" aria-label="Koraci prijave"
     th:with="nazivi=${ {'Studij', 'Domaćinstvo', 'Kriteriji', 'Dokumenti', 'Pregled'} }">
    <ol class="kp-lista">
        <li th:each="naziv, st : ${nazivi}"
            th:class="${st.count < trenutni} ? 'kp-korak kp--gotovo' : (${st.count == trenutni} ? 'kp-korak kp--sad' : 'kp-korak')"
            th:attr="aria-current=${st.count == trenutni} ? 'step' : null">
            <span class="kp-krug">
                <span class="kp-br" th:text="${st.count}">1</span>
                <svg class="kp-kvacica" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </span>
            <span class="kp-tekst">
                <small th:text="'Korak ' + ${st.count}">Korak 1</small>
                <b th:text="${naziv}">Studij</b>
            </span>
        </li>
    </ol>

    <!-- mobitel: tekst + traka napretka -->
    <div class="kp-mob">
        <span><b th:text="'Korak ' + ${trenutni} + ' od 5'">Korak 1 od 5</b> · <th:block th:text="${nazivi[trenutni - 1]}">Studij</th:block></span>
        <span class="kp-traka"><i th:style="'width:' + ${trenutni * 20} + '%'"></i></span>
    </div>
</nav>

</body>
</html>
