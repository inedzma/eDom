<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Zajednički dijelovi za SVE stranice E-Dom web aplikacije.

  Upotreba:
    <head>
        <th:block th:replace="~{fragments/layout :: head}"></th:block>
        ... stilovi specifični za stranicu ...
    </head>

    <footer th:replace="~{fragments/layout :: footer(false)}"></footer>   obični footer
    <footer th:replace="~{fragments/layout :: footer(true)}"></footer>    prozirni (login, registracija)

  Navbar će doći ovdje kad budemo radili stranice nakon prijave.
-->
<head>
    <title>fragmenti</title>
</head>
<body>

<!-- ============ HEAD: font + zajednički CSS ============ -->
<th:block th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" th:href="@{/img/studentski-centar-logo.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/edom.css}">
</th:block>

<!-- ============ FOOTER ============ -->
<footer th:fragment="footer(minimal)" class="footer" th:classappend="${minimal} ? 'footer--minimal'">
    <div class="footer-inner">
        <span>© <span th:text="${#dates.year(#dates.createNow())}">2026</span> Studentski centar Univerziteta u Zenici</span>
        <ul class="footer-links">
            <li><a th:href="@{/pomoc}">Pomoć</a></li>
            <li><a th:href="@{/kontakt}">Kontakt</a></li>
            <li><a th:href="@{/privatnost}">Privatnost</a></li>
        </ul>
    </div>
</footer>

</body>
</html>
